<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Bot Speaker</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      max-width: 800px;
    }
    .status {
      font-size: 24px;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .message {
      font-size: 20px;
      font-weight: bold;
      min-height: 40px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      margin-top: 15px;
    }
    .debug {
      font-size: 16px;
      margin-top: 20px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 5px;
      text-align: left;
      font-family: monospace;
      max-height: 400px;
      overflow-y: auto;
      line-height: 1.6;
    }
    .debug-line {
      margin: 4px 0;
    }
    .speaking {
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="status" id="status">AI Meeting Assistant</div>
    <div class="message" id="message">Listening...</div>
    <div class="debug" id="debug"></div>
    <audio id="audio" style="display: none;"></audio>
  </div>

  <script>
    // Get botId from URL hash (e.g., #botId123) or query parameter
    let botId = window.location.hash.substring(1); // Remove the # character
    if (!botId) {
      botId = new URLSearchParams(window.location.search).get('botId');
    }
    const serverUrl = new URLSearchParams(window.location.search).get('server') || 'http://localhost:3333';

    console.log('Bot ID:', botId);
    console.log('Server URL:', serverUrl);

    const status = document.getElementById('status');
    const message = document.getElementById('message');
    const debugDiv = document.getElementById('debug');
    const audioElement = document.getElementById('audio');

    // Debug logging
    function addDebug(msg) {
      const timestamp = new Date().toLocaleTimeString();
      const line = document.createElement('div');
      line.className = 'debug-line';
      line.textContent = `[${timestamp}] ${msg}`;
      debugDiv.appendChild(line);
      debugDiv.scrollTop = debugDiv.scrollHeight;
      console.log(msg);
    }

    addDebug(`Bot ID: ${botId}`);
    addDebug(`Server URL: ${serverUrl}`);

    let lastAudioUrl = '';

    function playAudio(audioUrl, text) {
      addDebug(`playAudio() called with URL: ${audioUrl}`);

      message.textContent = text;
      status.textContent = 'Speaking...';

      audioElement.src = audioUrl;
      audioElement.load();

      audioElement.onloadeddata = () => {
        addDebug('Audio loaded, starting playback');
        audioElement.play().then(() => {
          addDebug('Audio playback started');
        }).catch(error => {
          addDebug(`Audio playback error: ${error.message}`);
        });
      };

      audioElement.onplay = () => {
        addDebug('Audio playing');
      };

      audioElement.onended = () => {
        addDebug('Audio playback ended');
        status.textContent = 'AI Meeting Assistant';
        message.textContent = 'Listening...';
      };

      audioElement.onerror = (error) => {
        addDebug(`Audio error: ${audioElement.error?.message || 'Unknown error'}`);
        status.textContent = 'Error';
      };
    }

    let lastMessage = '';
    let pollCount = 0;

    // Poll for new messages to speak
    async function pollForMessages() {
      if (!botId) {
        message.textContent = 'No bot ID provided';
        addDebug('ERROR: No bot ID provided');
        return;
      }

      try {
        pollCount++;
        const response = await fetch(`${serverUrl}/bot-speech-data/${botId}`);

        if (response.ok) {
          const data = await response.json();

          if (data.audioUrl && data.audioUrl !== lastAudioUrl) {
            addDebug(`Poll #${pollCount}: New audio detected!`);
            const msgPreview = data.message ? data.message.substring(0, 50) : '(no message)';
            addDebug(`Message: "${msgPreview}..."`);
            addDebug(`Audio URL: ${data.audioUrl}`);
            lastAudioUrl = data.audioUrl;
            lastMessage = data.message;
            playAudio(serverUrl + data.audioUrl, data.message);
          }
          // Don't log when there's no new message to reduce clutter
        } else {
          addDebug(`Poll #${pollCount}: HTTP ERROR ${response.status}`);
        }
      } catch (error) {
        addDebug(`Poll #${pollCount}: FETCH ERROR - ${error.message}`);
        console.error('Failed to fetch message:', error);
      }

      // Poll every 2 seconds (reduced from 500ms for debugging)
      setTimeout(pollForMessages, 2000);
    }

    // WebSocket connection for real-time messages
    function connectWebSocket() {
      if (!botId) return;

      addDebug('Attempting WebSocket connection...');
      const ws = new WebSocket(`${serverUrl.replace('http', 'ws')}/bot-speech-ws/${botId}`);

      ws.onopen = () => {
        addDebug('WebSocket connected');
        console.log('WebSocket connected');
        status.textContent = 'Connected';
      };

      ws.onmessage = (event) => {
        addDebug('WebSocket message received');
        const data = JSON.parse(event.data);
        if (data.audioUrl) {
          playAudio(serverUrl + data.audioUrl, data.message);
        }
      };

      ws.onerror = (error) => {
        addDebug('WebSocket error, falling back to polling');
        console.error('WebSocket error:', error);
        // Fallback to polling
        pollForMessages();
      };

      ws.onclose = () => {
        addDebug('WebSocket closed, using polling');
        console.log('WebSocket closed, using polling');
        pollForMessages();
      };
    }

    // Try WebSocket first, fallback to polling
    connectWebSocket();

    // Log when page is loaded
    window.addEventListener('load', () => {
      addDebug('Page loaded, ready to receive audio');
    });
  </script>
</body>
</html>
